[project]
name = "deribit-mcp-server"
version = "0.1.0"
description = "MCP server for Deribit exchange integration with price alerts and notifications"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later OR Commercial" }
authors = [
    { name = "Georg Schröjahr" },
]
readme = "README.md"
dependencies = [
    "fastmcp==2.14.3",
    "fastapi==0.115.6",
    "uvicorn==0.35.0",
    "packaging>=23.0",
    "aiosqlite>=0.20",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/schroejahr2/deribit-mcp"
Upstream = "https://github.com/Oishh/telegram-signal-mcp-server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
